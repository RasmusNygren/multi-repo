[workspace]
members = [
    "crates/multi-repo-core",
    "crates/multi-repo-cli",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/RasmusNygren/multi-repo"
rust-version = "1.95"
description = "Fast, safe management and search across collections of Git repositories"
readme = "README.md"
keywords = ["git", "repository", "search", "cli"]
categories = ["command-line-utilities", "development-tools"]

[workspace.dependencies]
base64 = "0.22.1"
clap = { version = "4.5.47", features = ["derive"] }
globset = "0.4.16"
grep-matcher = "0.1.8"
grep-regex = "0.1.14"
grep-searcher = "0.1.14"
ignore = "0.4.23"
# Reqwest 0.13's Rustls path adds AWS-LC and platform-verifier build trees.
# Re-evaluate once it offers a comparably small native-roots configuration.
reqwest = { version = "0.12.28", default-features = false, features = ["json", "rustls-tls-native-roots"] }
rusqlite = { version = "0.40.1", default-features = false, features = ["bundled"] }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.143"
tempfile = "3.21.0"
thiserror = "2.0.16"
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread"] }
toml = { version = "1.1.3", default-features = false, features = ["parse", "serde"] }
url = "2.5.7"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
