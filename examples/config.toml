[[source]]
name = "github"
kind = "github"
# Set to true to clone and fetch all origin branches for this source.
fetch_all_branches = false
api_url = "https://api.github.com"
# For a local-only configuration, this can instead be `token = "..."`.
token_env = "GITHUB_TOKEN"
clone_protocol = "ssh"
include_forks = false
include_archived = false

[[source]]
name = "stash"
kind = "bitbucket-server"
fetch_all_branches = false
base_url = "https://stash.example.com"
# For a local-only configuration, this can instead be `token = "..."`.
token_env = "BITBUCKET_TOKEN"
clone_protocol = "ssh"
projects = ["PLATFORM"]

[[repo]]
id = "acme/widget"
url = "git@github.com:acme/widget.git"
default_branch = "main"
tags = ["rust", "service"]
